name: Post-Merge Completion Observer

on:
  workflow_run:
    workflows:
      - Quality
      - E2E
      - A1 cross-platform contracts
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  observe:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out trusted default branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - name: Classify completion evidence (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/post-merge-completion/observer.mjs
