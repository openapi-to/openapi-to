name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  common:
    name: CLI CommonJS E2E (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-common
      CLI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/cli-common
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-common
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm run build
      - name: Run deterministic CommonJS CLI E2E
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id cli-e2e -- pnpm test:e2e:common
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-common --job-status "${{ job.status }}" --matrix "os=${{ matrix.os }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-common-${{ matrix.os }}
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload CommonJS CLI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-common-${{ matrix.os }}
          path: |
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-runtime.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-summary.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-fixture.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-files.json
          if-no-files-found: warn
          retention-days: 14

  module:
    name: CLI ESM E2E (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-module
      CLI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/cli-module
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-module
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm run build
      - name: Run deterministic ESM CLI E2E
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id cli-e2e -- pnpm test:e2e:module
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-module --job-status "${{ job.status }}" --matrix "os=${{ matrix.os }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-module-${{ matrix.os }}
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload ESM CLI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-module-${{ matrix.os }}
          path: |
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-runtime.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-summary.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-fixture.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-files.json
          if-no-files-found: warn
          retention-days: 14

  remote:
    name: CLI local HTTP E2E (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-remote
      CLI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/cli-remote
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-remote
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm run build
      - name: Generate from controlled local HTTP fixtures
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id cli-e2e -- pnpm test:e2e:remote
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-remote --job-status "${{ job.status }}" --matrix "os=${{ matrix.os }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-remote-${{ matrix.os }}
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload remote CLI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-remote-${{ matrix.os }}
          path: |
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-runtime.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-summary.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-fixture.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/cli-files.json
          if-no-files-found: warn
          retention-days: 14

  mcp-stdio-e2e:
    name: MCP stdio E2E
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-mcp-stdio
      MCP_TEST_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/mcp-stdio
      MCP_DOCTOR_REPORT: ${{ github.workspace }}/.ci-artifacts/mcp-doctor.json
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-mcp-stdio
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Test built-bin stdio and controlled-write protocol
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-stdio -- pnpm test:mcp:stdio
      - name: Run MCP Doctor
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-doctor -- pnpm mcp:check -- --json --output "${{ env.MCP_DOCTOR_REPORT }}"
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-mcp-stdio --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-mcp-stdio-e2e
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized MCP Doctor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-doctor-node20
          path: ${{ env.MCP_DOCTOR_REPORT }}
          if-no-files-found: error
          retention-days: 14

  mcp-cross-platform:
    name: MCP cross-platform smoke (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-mcp-smoke
      MCP_TEST_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/mcp-smoke
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-mcp-cross-platform
      - name: Setup Node 22 and pnpm
        id: setup
        uses: ./.github/setup
      - name: Initialize, list tools, validate, and close
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-smoke -- pnpm test:mcp:smoke
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-mcp-cross-platform --job-status "${{ job.status }}" --matrix "os=${{ matrix.os }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-mcp-cross-platform-${{ matrix.os }}
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload MCP smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-smoke-${{ matrix.os }}
          path: |
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/mcp-runner.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/mcp-results.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/mcp-smoke.json
          if-no-files-found: warn
          retention-days: 14

  mcp-transaction-safety:
    name: MCP transaction safety
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-mcp-transaction
      MCP_TEST_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/mcp-transaction
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-mcp-transaction-safety
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Test rollback, recovery, cancellation, and locks
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-recovery -- pnpm test:mcp:recovery
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-mcp-transaction-safety --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-mcp-transaction-safety
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  mcp-performance:
    name: MCP performance and bounded stress
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-e2e-mcp-performance
      MCP_TEST_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/mcp-performance
      CI_BASE_SHA: ''
      CI_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan e2e-mcp-performance
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Run benchmark regression and bounded stress
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-performance -- pnpm test:mcp:performance
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan e2e-mcp-performance --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-e2e-mcp-performance
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  required-e2e:
    name: Required E2E
    if: always() && github.event_name != 'schedule'
    needs: [common, module, remote, mcp-stdio-e2e, mcp-cross-platform, mcp-transaction-safety]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      CI_REQUIRED_JOBS: common,module,remote,mcp-stdio-e2e,mcp-cross-platform,mcp-transaction-safety
      CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every ordinary E2E dependency
        run: |
          node -e 'const expected=process.env.CI_REQUIRED_JOBS.split(",").sort(); const results=JSON.parse(process.env.CI_REQUIRED_RESULTS); const actual=Object.keys(results).sort(); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`required Job set mismatch: ${actual.join(",")}`); const blocked=Object.entries(results).filter(([,value]) => value.result !== "success"); if (blocked.length > 0) throw new Error(`required Jobs did not succeed: ${blocked.map(([name,value]) => `${name}=${value.result}`).join(",")}`);'
