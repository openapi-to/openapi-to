name: Version Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - ".changeset/pre.json"
      - "packages/*/package.json"
      - "packages/*/CHANGELOG.md"
      - "e2e/*/package.json"
      - "e2e/*/CHANGELOG.md"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset-state:
    name: Verify strict Changesets state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-version-readiness
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IS_VERSION_PACKAGES_PR: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'changeset-release/main' &&
            github.event.pull_request.user.login == 'github-actions[bot]' }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan version-readiness
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Verify strict Version Packages Changesets state
        if: env.IS_VERSION_PACKAGES_PR == 'true'
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id changeset-state -- pnpm verify:changeset-state
      - name: Verify development Changesets state
        if: env.IS_VERSION_PACKAGES_PR != 'true'
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id changeset-state -- pnpm verify:changeset-state:development
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan version-readiness --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-version-readiness-changeset-state
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
