name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-quality-build
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan quality-build
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm build --concurrency=1
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan quality-build --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-quality-build
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-quality-typecheck
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan quality-typecheck
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm build --concurrency=1
      - name: Package typecheck
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id package-typecheck -- pnpm typecheck --concurrency=1
      - name: Project-reference typecheck
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id project-reference-typecheck -- pnpm exec tsc -b
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan quality-typecheck --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-quality-typecheck
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-quality-tests
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan quality-tests
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm build
      - name: Test
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id test -- pnpm test:vitest
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan quality-tests --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-quality-tests
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  lint-changed:
    name: Lint changed files
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-quality-lint-changed
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan quality-lint-changed
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Test lint collector
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id test-lint-collector -- pnpm test:release-scripts
      - name: Lint pull request files
        if: github.event_name == 'pull_request'
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id lint-changed -- pnpm lint:changed --base "${{ github.event.pull_request.base.sha }}"
      - name: Lint pushed files
        if: github.event_name == 'push'
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id lint-changed -- pnpm lint:changed --base "${{ github.event.before }}"
      - name: Lint merge-group files
        if: github.event_name == 'merge_group'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          test -n "${MERGE_GROUP_BASE_SHA}"
          test "${MERGE_GROUP_HEAD_SHA}" = "${GITHUB_SHA}"
          node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id lint-changed -- pnpm lint:changed --base "${MERGE_GROUP_BASE_SHA}"
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan quality-lint-changed --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-quality-lint-changed
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  release-smoke:
    name: Package and install smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-quality-release-smoke
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan quality-release-smoke
      - name: Setup
        id: setup
        uses: ./.github/setup
      - name: Build
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm build
      - name: Verify repository contracts
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id repository-contracts -- pnpm verify:repository-contract
      - name: Verify package surface
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id package-surface -- pnpm verify:package-surface
      - name: Pack and install packages
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id pack-install -- pnpm release:smoke
      - name: Verify Changesets development state
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id changesets-development -- pnpm verify:changeset-state:development
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan quality-release-smoke --job-status "${{ job.status }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-quality-release-smoke
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14

  required-quality:
    name: Required quality
    if: always()
    needs: [build, typecheck, tests, lint-changed, release-smoke]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      CI_REQUIRED_JOBS: build,typecheck,tests,lint-changed,release-smoke
      CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every Quality dependency
        run: |
          node -e 'const expected=process.env.CI_REQUIRED_JOBS.split(",").sort(); const results=JSON.parse(process.env.CI_REQUIRED_RESULTS); const actual=Object.keys(results).sort(); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`required Job set mismatch: ${actual.join(",")}`); const blocked=Object.entries(results).filter(([,value]) => value.result !== "success"); if (blocked.length > 0) throw new Error(`required Jobs did not succeed: ${blocked.map(([name,value]) => `${name}=${value.result}`).join(",")}`);'
