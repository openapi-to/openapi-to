name: A1 cross-platform contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    name: A1 focused (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_DIAGNOSTIC_DIR: ${{ github.workspace }}/.ci-artifacts/ci-diagnostics-a1
      A1_TEST_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/a1-contracts
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CI diagnostics
        id: diagnostics-init
        run: node scripts/ci-diagnostics/initialize.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --plan a1-contracts
      - name: Setup Node 22 and pnpm
        id: setup
        uses: ./.github/setup
      - name: Run openapi-to setup inspector tests
        run: node --test scripts/openapi-to-setup.node-test.mjs
      - name: Verify pnpm launcher
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id pnpm-launcher -- pnpm --version
      - name: Build packages
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id build -- pnpm build --concurrency=1
      - name: Run focused Codex Skill installer tests
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id codex-skills-installer-tests -- pnpm --filter @openapi-to/cli test:skills-installer
      - name: Run built Codex Skill installer smoke
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id codex-skills-installer-built-bin -- node scripts/codex-skills-installer-cross-platform-smoke.mjs
      - name: Run A1 focused contracts
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id a1-contracts -- pnpm test:a1-contracts
      - name: Verify openapi CLI alias
        working-directory: e2e/common
        run: node ../../scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id cli-openapi-help --cwd . -- pnpm exec openapi --help
      - name: Verify openapi-to CLI alias
        working-directory: e2e/common
        run: node ../../scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id cli-openapi-to-version --cwd . -- pnpm exec openapi-to --version
      - name: Verify aggregate MCP CLI alias
        working-directory: e2e/common
        run: node ../../scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id cli-mcp-help --cwd . -- pnpm exec openapi-to-mcp --help
      - name: Verify aggregate MCP wrapper
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-openapi-wrapper -- node packages/openapi/bin/openapi-to-mcp.js --help
      - name: Verify package MCP wrapper
        run: node scripts/ci-diagnostics/run-command.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --id mcp-package-wrapper -- node packages/mcp/bin/openapi-to-mcp.js --help
      - name: Finalize CI diagnostics
        if: always()
        run: node scripts/ci-diagnostics/finalize-job.mjs --dir "${{ env.CI_DIAGNOSTIC_DIR }}" --upload-dir "${{ steps.diagnostics-init.outputs.upload-dir }}" --plan a1-contracts --job-status "${{ job.status }}" --matrix "os=${{ matrix.os }}" --step "checkout=${{ steps.checkout.outcome }}" --step "diagnostics-init=${{ steps.diagnostics-init.outcome }}" --step "setup=${{ steps.setup.outcome }}"
      - name: Upload CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-a1-cross-platform-contracts-contracts-${{ matrix.os }}
          path: ${{ steps.diagnostics-init.outputs.upload-dir }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload A1 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a1-contracts-${{ matrix.os }}
          path: |
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/a1-runtime.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/a1-summary.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/a1-inventory.json
            ${{ steps.diagnostics-init.outputs.upload-dir }}/known-reports/a1-vitest.json
          if-no-files-found: warn
          retention-days: 14

  required-a1:
    name: Required A1 cross-platform
    if: always()
    needs: [contracts]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      CI_REQUIRED_JOBS: contracts
      CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every A1 dependency
        run: |
          node -e 'const expected=process.env.CI_REQUIRED_JOBS.split(",").sort(); const results=JSON.parse(process.env.CI_REQUIRED_RESULTS); const actual=Object.keys(results).sort(); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`required Job set mismatch: ${actual.join(",")}`); const blocked=Object.entries(results).filter(([,value]) => value.result !== "success"); if (blocked.length > 0) throw new Error(`required Jobs did not succeed: ${blocked.map(([name,value]) => `${name}=${value.result}`).join(",")}`);'
