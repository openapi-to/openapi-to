name: Save Turborepo task cache
description: Save the bounded local Turbo task cache after a canonical successful build.

inputs:
  cache-key:
    description: Exact immutable cache key computed by the restore action.
    required: true

runs:
  using: composite
  steps:
    - name: Save Turbo cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ inputs.cache-key }}
        enableCrossOsArchive: false
