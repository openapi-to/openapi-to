name: Restore Turborepo task cache
description: Restore the bounded, OS/toolchain-scoped local Turbo task cache.

outputs:
  cache-key:
    description: Exact immutable cache key for this commit.
    value: ${{ steps.key.outputs.cache-key }}
  cache-hit:
    description: Whether the exact cache key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    description: Exact or prefix cache key selected by GitHub.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - id: key
      name: Compute bounded Turbo cache key
      shell: bash
      run: node scripts/turbo-cache-key.mjs
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        GITHUB_SHA: ${{ github.sha }}

    - id: restore
      name: Restore Turbo cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ steps.key.outputs.cache-key }}
        restore-keys: ${{ steps.key.outputs.restore-prefix }}
        enableCrossOsArchive: false
