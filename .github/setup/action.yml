name: "Setup"
description: "Sets up Node.js and runs install"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      with:
        version: 11.26.0

    - name: Setup Node.js environment
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        # Vite 8 requires Node >=22.12.0; the 22 lane resolves its current patch.
        node-version: 22
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Setup Git User
      shell: bash
      run: |
        git config --global user.email "znro001@126.com"
        git config --global user.name "Vc-great"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
