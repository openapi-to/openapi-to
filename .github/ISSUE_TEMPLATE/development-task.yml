name: 开发任务
description: 描述目标、范围和验收条件。
title: "type(scope): "
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 完成后应出现什么可观察结果？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与背景
      description: 说明相关代码、约束、依赖或已有工作。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 列出可验证的行为与必要测试。
    validations:
      required: true
