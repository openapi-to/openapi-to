name: Development task
description: 定义可长期追踪、可审查的 openapi-to 实施任务。
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        将此 Issue 作为 Task Contract：记录持久的目标、范围与验收标准（not an Agent execution transcript）；临时指令、命令日志和会话历史应留在执行会话中。
  - type: textarea
    id: goal
    attributes:
      label: 目标（Goal）
      description: 任务完成后应当出现什么可观察结果？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围（Scope）
      description: 本任务允许修改什么？
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 非目标（Non-goals）
      description: 哪些事项不得扩展到本任务？
    validations:
      required: true
  - type: dropdown
    id: authorization-mode
    attributes:
      label: 执行/授权模式（Execution / Authorization Mode）
      description: 此治理字段记录拟议的未来模式；does not grant runtime authority or trigger automation。
      options:
        - Manual
        - Design Approved
        - Autonomous
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖（Dependencies）
      description: 写明 blocking Issue、未合入 PR、必要阶段；没有依赖时填写 "none"。
    validations:
      required: true
  - type: dropdown
    id: parallelization
    attributes:
      label: 并发分类（Parallelization）
      description: 本任务与其他活动任务如何协作？以真实依赖和写入表面为准。
      options:
        - Parallel Safe
        - Shared Surface
        - Dependent
    validations:
      required: true
  - type: textarea
    id: conflict-surface
    attributes:
      label: 冲突表面（Conflict surface）
      description: 指出共享 package、生成输出、lockfile、root 配置、workflow、Skill 或 release 状态；不清楚时填写 "Need Verification"，确认没有时填写 "none known"。
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 风险（Risk）
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准（Acceptance criteria）
      description: 列出能够证明目标完成的可观察条件。
    validations:
      required: true
  - type: textarea
    id: validation-expectations
    attributes:
      label: 验证预期（Validation expectations）
      description: 写明实施所需的重要测试、CI、兼容性或 Review 证据。
    validations:
      required: true
  - type: textarea
    id: write-ownership
    attributes:
      label: 写入所有权（Owned write surface）
      description: 记录本 Task 允许主要修改的路径、package 或 surface；列出只能读取的 Shared Surface、已知 prohibited paths；不清楚时必须填写 Need Verification，不得猜测。
    validations:
      required: true
  - type: textarea
    id: start-integration-gate
    attributes:
      label: 启动与集成门（Start / Integration gate）
      description: 记录启动前置条件、blocking Issue/PR、是否必须等待任务合入、是否采用 stacked development、推荐 integration order，以及前置任务合入后必须 revalidation 的假设。
    validations:
      required: true
