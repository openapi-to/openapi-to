interface:
  display_name: "Set up openapi-to"
  short_description: "Install and diagnose openapi-to setup and Codex MCP runtime"
  default_prompt: "Use $openapi-to-setup for installation/bootstrap, generation-config or Host/MCP setup failures, and runtime diagnosis only. Route ordinary first Codex project bootstrap directly to the published CLI command `openapi setup --host codex --scope project`; do not use a Skill Setup Plan for it. For diagnosed degraded project or Host recovery, start with the Inspector and preserve PACKAGE_READY state; use supported config, a bounded Setup Plan, hash-setup-plan.mjs, exact approval, and stop at RESTART_REQUIRED after Host config writes. Route consumer product/plugin/config reference and generated-output integration to $openapi-to-generate."
