schema_version: 1
kind: static_skill_evaluation_inputs
cases:
  - id: trigger-bare-api-path
    category: trigger
    prompt: "/pet/findByStatus"
    expected: activate_read_only_operation_discovery
  - id: trigger-method-api-path
    category: trigger
    prompt: "GET /pet/findByStatus"
    expected: activate_read_only_operation_discovery
  - id: trigger-api-path-implementation
    category: trigger
    prompt: "把 /pet/findByStatus 接到当前页面"
    expected: activate_generate_workflow
  - id: degraded-frontend-route-no-match
    category: degraded
    prompt: "/dashboard/settings"
    expected: do_not_invent_operation_and_fail_closed
  - id: degraded-bare-path-ambiguous
    category: degraded
    prompt: "/pet/findByStatus matches GET and POST operations"
    expected: ask_without_guessing_method_or_operation
  - id: degraded-bare-path-target-unknown
    category: degraded
    prompt: "Discover /pet/findByStatus when the target is unknown"
    expected: list_targets_before_operation_search
  - id: degraded-bare-path-tool-list-unavailable
    category: degraded
    prompt: "Discover /pet/findByStatus but the actual MCP Tool list/schema is unavailable"
    expected: fail_closed_without_search
  - id: trigger-user-delete
    category: trigger
    prompt: "根据接口文档实现用户删除功能"
    expected: activate
  - id: trigger-order-export
    category: trigger
    prompt: "查找订单导出接口并生成请求代码"
    expected: activate
  - id: trigger-page-api-call
    category: trigger
    prompt: "用 openapi-to 为当前页面增加 API 调用"
    expected: activate
  - id: trigger-openapi-feature
    category: trigger
    prompt: "从 OpenAPI 中找到对应接口后完成业务功能"
    expected: activate
  - id: trigger-operation-client
    category: trigger
    prompt: "生成当前 operation 所需的类型和 request client"
    expected: activate
  - id: trigger-order-detail
    category: trigger
    prompt: "根据 OpenAPI 实现订单详情查询"
    expected: activate
  - id: first-discovery-mcp-authority
    category: trigger
    prompt: "增加用户查询 API；请先依据当前 MCP Tools 和 Schemas 找到接口"
    expected: use_current_mcp_before_broad_openapi_scan
  - id: first-discovery-target-then-search
    category: trigger
    prompt: "Target 未明确时发现用户查询接口，并只预览所需 operation"
    expected: list_target_when_not_exact_then_search
  - id: first-discovery-bounded-contract
    category: trigger
    prompt: "找到候选后读取该 operation 的有界契约，再预览生成结果"
    expected: retrieve_exact_operation_contract
  - id: degraded-broad-openapi-first
    category: degraded
    prompt: "Agent 已先全文读取 OpenAPI 并决定 endpoint，再调用 MCP 确认"
    expected: do_not_use_full_spec_as_happy_path_authority
  - id: completion-bounded-evidence
    category: degraded
    prompt: "完成报告必须保留 Dry Run 返回的 selection、projection、artifact、diagnostic 证据"
    expected: preserve_returned_selection_projection_artifact_diagnostic_evidence
  - id: completion-truncated-evidence
    category: degraded
    prompt: "Dry Run 返回的 artifacts 和 diagnostics 被截断时如何报告？"
    expected: report_returned_and_total_without_claiming_unseen_content
  - id: preview-generator-provenance
    category: trigger
    prompt: "仅当 Dry Run 返回 artifact.preview 时展示 generator preview"
    expected: call_generator_preview_only_when_returned_by_tool
  - id: preview-agent-example
    category: trigger
    prompt: "MCP 未返回 preview，但需要展示示意代码"
    expected: label_agent_written_example_as_illustrative
  - id: degraded-include-preview-schema-missing
    category: degraded
    prompt: "当前 Dry Run inputSchema 没有 includePreview 参数"
    expected: do_not_invent_include_preview_parameter
  - id: composite-first-attempt-generate
    category: trigger
    prompt: "这个项目需要增加“根据 userId 查询用户”的 API 调用。\n请根据项目中的 OpenAPI 定义找到正确接口，\n并先预览需要生成的代码，不要写入任何文件。"
    expected: first_attempt_mcp_authoritative_read_only_preview
  - id: reject-button-color
    category: reject
    prompt: "修改删除按钮的颜色"
    expected: do_not_activate
  - id: reject-table-layout
    category: reject
    prompt: "调整用户表格布局"
    expected: do_not_activate
  - id: reject-local-sort
    category: reject
    prompt: "优化本地数组排序"
    expected: do_not_activate
  - id: reject-static-copy
    category: reject
    prompt: "修改订单页静态文案"
    expected: do_not_activate
  - id: reject-mcp-tool-change
    category: reject
    prompt: "给 openapi-to MCP 新增一个 Tool"
    expected: do_not_activate
  - id: reject-package-release
    category: reject
    prompt: "发布 openapi-to 的 npm 稳定版"
    expected: do_not_activate
  - id: degraded-server-absent
    category: degraded
    prompt: "实现用户删除，但 openapi_to MCP Server 未启动"
    expected: fail_closed_explain_server_setup
  - id: degraded-analysis-only
    category: degraded
    prompt: "查找导出接口，但实际只暴露 3 个分析 Tool"
    expected: fail_closed_explain_config_requirement
  - id: degraded-ambiguous-search
    category: degraded
    prompt: "增加订单导出，搜索返回多个无法从代码区分的候选"
    expected: ask_material_candidate_choice
  - id: degraded-stale-plan
    category: degraded
    prompt: "已批准的 planHash 在 Apply 前因 OpenAPI 变化而 stale"
    expected: reprepare_and_require_new_exact_approval
  - id: degraded-multiple-targets-require-exact-target
    category: degraded
    prompt: "项目配置了多个 Target，需要生成用户删除接口"
    expected: list_targets_and_pass_one_exact_target
  - id: degraded-generate-tool-without-operation-scope
    category: degraded
    prompt: "openapi_generate 存在，但 inputSchema 不支持 operations selection"
    expected: fail_closed_without_full_generation_fallback
  - id: degraded-prepare-add-only
    category: degraded
    prompt: "Prepare Tool 存在，但 inputSchema 只支持 selection add"
    expected: allow_add_and_reject_replace
  - id: degraded-prepare-without-selection
    category: degraded
    prompt: "Prepare Tool 存在，但 inputSchema 没有 selection 参数"
    expected: do_not_invent_selective_prepare
  - id: degraded-schema-not-visible
    category: degraded
    prompt: "Host 只能显示 MCP Tool 名称，无法查看 inputSchema"
    expected: use_only_verified_capabilities_and_fail_closed_for_replace
  - id: degraded-prepare-not-applyable
    category: degraded
    prompt: "Prepare 成功但 plan.applySupported 为 false"
    expected: stop_before_approval_and_apply
  - id: degraded-tool-list-missing
    category: degraded
    prompt: "Host 声称 MCP 已连接，但无法取得实际 Tool 列表"
    expected: fail_closed_without_operation_workflow
  - id: degraded-old-tool-schema
    category: degraded
    prompt: "旧版本暴露同名 Tool，但 inputSchema 不支持当前选择参数"
    expected: use_only_observed_schema_without_upgrade
  - id: degraded-replace-unsupported
    category: degraded
    prompt: "用户明确要求 replace，但当前 Prepare Schema 只支持 add"
    expected: reject_replace_without_emulation
  - id: degraded-prepare-missing
    category: degraded
    prompt: "只读 Tool 可用，但 openapi_prepare_generation 不存在"
    expected: remain_read_only_without_prepare
  - id: degraded-apply-missing
    category: degraded
    prompt: "Prepare Tool 可见，但 openapi_apply_generation 不存在"
    expected: stop_before_prepare_apply_workflow
  - id: degraded-apply-token-expired
    category: degraded
    prompt: "已批准计划的 Apply token 已过期"
    expected: reprepare_and_require_new_exact_approval
  - id: degraded-plan-hash-drift
    category: degraded
    prompt: "用户批准的 planHash 与当前 Prepare 结果不一致"
    expected: reject_apply_and_require_exact_current_hash
  - id: degraded-setup-not-ready
    category: degraded
    prompt: "Setup 返回 PACKAGE_MISSING、CONFIG_MISSING、HOST_CONFIG_MISSING、RESTART_REQUIRED 或 BLOCKED"
    expected: do_not_start_generate_workflow
  - id: degraded-setup-any-other-state
    category: degraded
    prompt: "Setup 返回 MCP_ANALYSIS_ONLY、任一尚未验证状态或未来新增状态"
    expected: do_not_start_generate_for_unlisted_setup_state
