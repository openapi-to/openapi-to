interface:
  display_name: "Generate with openapi-to"
  short_description: "Reference openapi-to and integrate API code"
  default_prompt: "Use $openapi-to-generate for consumer product/plugin/config reference, API discovery or implementation, and integration of existing generated output. For exact options, use the installed package's public declarations; route setup/runtime failures to $openapi-to-setup. Bare API paths are read-only discovery. Keep implementation on the existing MCP generation workflow and inspect actual generated artifacts before integration; routing grants no additional write or approval authority."
