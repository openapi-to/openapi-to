packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
  - 'e2e/*'

# These packages were already denied by pnpm 10's install policy. Keep their
# lifecycle scripts explicitly disabled under pnpm 11's strict build policy.
allowBuilds:
  esbuild: false
  msw: false
  vue-demi: false

catalog:
  '@biomejs/biome': '^2.5.13'
  '@changesets/changelog-github': '^1.0.1'
  '@changesets/cli': '3.0.2'
  '@changesets/parse': '^1.0.0'
  '@commitlint/cli': '^21.2.2'
  '@commitlint/config-conventional': '^21.2.2'
  '@microsoft/api-extractor': '^7.59.1'
  '@modelcontextprotocol/sdk': '1.30.0'
  '@tanstack/vue-query': '^5.102.8'
  '@types/cli-progress': '^3.11.6'
  '@types/fs-extra': '^11.0.4'
  '@types/is-url': '^1.2.32'
  '@types/json-schema': '^7.0.15'
  '@types/lodash': '^4.17.25'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^22.20.2'
  '@types/react': '19.3.0'
  '@types/seedrandom': '^3.0.8'
  '@types/semver': '^7.8.0'
  '@types/update-notifier': '^6.0.8'
  '@vitest/coverage-v8': '^5.0.0'
  '@vitest/ui': '^5.0.0'
  axios: '1.20.0'
  bun-types: '^1.4.2'
  bundle-require: '^5.1.0'
  cac: '^7.0.0'
  cli-progress: '^3.12.0'
  code-block-writer: '13.0.3'
  consola: '^3.4.2'
  # Hold 10.x: it requires Node ^22.18 || >=24 while Core's public floor
  # remains >=22. Recheck the Node-floor decision before upgrading.
  cosmiconfig: '^9.0.2'
  directory-tree: '^3.6.0'
  do-swagger2openapi: '^7.0.20'
  esbuild: '^0.28.2'
  execa: '^10.0.1'
  find-up: '^8.0.0'
  fs-extra: '^11.4.0'
  husky: '^9.1.7'
  is-chinese: '^2.0.0'
  is-url: '^1.2.4'
  # 5.4.2 is newer, but remains held until pnpm's 1440-minute age window
  # accepts it. Recheck with `pnpm outdated -r --format json` and npm metadata.
  js-yaml: '5.4.1'
  json-schema: '^0.4.0'
  lodash: '^4.18.1'
  lodash-es: '^4.18.1'
  msw: '^2.15.0'
  oas: '^38.5.3'
  openapi-types: '^12.1.3'
  ora: '^9.4.1'
  picocolors: '^1.1.1'
  pinyin-pro: '^3.29.4'
  pretty-error: '^4.0.0'
  rimraf: '^6.1.3'
  seedrandom: '^3.0.5'
  semver: '^7.8.5'
  source-map-support: '^0.5.21'
  string-argv: '^0.3.2'
  swr: '2.5.1'
  tar: '7.5.22'
  ts-morph: '28.0.0'
  ts-node: '^10.9.2'
  tsdown: '0.23.0'
  turbo: '^2.10.12'
  type-fest: '5.9.0'
  # TypeScript 7 provides the repository CLI; the bare package remains the
  # stable TypeScript 6 API bridge required by ts-morph and other tooling.
  typescript: 'npm:@typescript/typescript6@6.0.2'
  typescript-7: 'npm:typescript@7.0.2'
  update-notifier: '^7.3.1'
  utility-types: '^3.11.0'
  vite: '^8.3.0'
  vite-tsconfig-paths: '^6.1.1'
  vitest: '^5.0.0'
  vue: '^3.5.42'
  ypkgfiles: '^1.6.0'
  zod: '^4.6.3'

# Preserve the MCP runtime's exact Zod pin and plugin-zod's wider peer contract.
catalogs:
  zod-exact:
    zod: '4.6.3'
  zod-peer:
    zod: '^4.0.0'

# These exact Biome 2.5.13 entries were already present in the task-base
# lockfile but were published less than 24 hours before this migration. Keep
# pnpm 11's 1440-minute default for every other dependency; remove these
# narrowly scoped exceptions once the dependency audit can refresh the graph.
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.13'
  - '@biomejs/cli-darwin-arm64@2.5.13'
  - '@biomejs/cli-darwin-x64@2.5.13'
  - '@biomejs/cli-linux-arm64-musl@2.5.13'
  - '@biomejs/cli-linux-arm64@2.5.13'
  - '@biomejs/cli-linux-x64-musl@2.5.13'
  - '@biomejs/cli-linux-x64@2.5.13'
  - '@biomejs/cli-win32-arm64@2.5.13'
  - '@biomejs/cli-win32-x64@2.5.13'
